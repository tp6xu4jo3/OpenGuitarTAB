name: Apply native pointer drag rewrite
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/perf/native-pointer-drag-indicators'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rewrite drag controllers and indicators
        run: python scripts/apply-native-pointer-drag.py
      - name: Test
        run: npm test
      - name: Benchmark
        run: npm run benchmark:editor-layout
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-native-pointer-drag.yml scripts/apply-native-pointer-drag.py
          git add src/editor/chord-drag-controller.js src/editor/ribbon.js src/editor/structure-controller.js styles/editor-v3.css styles/editor-modules.css styles/editor-row-controls.css tests/editor-structure-cleanup.test.mjs tests/editor-ribbon.test.mjs tests/editor-grid-structure-regression.test.mjs
          git commit -m "perf: make drag indicators follow native hover"
          git push origin HEAD:perf/native-pointer-drag-indicators
