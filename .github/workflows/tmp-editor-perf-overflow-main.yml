name: Temporary editor performance and overflow fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-editor-perf-overflow-main.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          sidebar = Path('styles/sidebar.css')
          text = sidebar.read_text()
          old = ".song-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding-right: 2px; }"
          new = ".song-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding-right: 2px; scrollbar-width: thin; scrollbar-color: #4a4a4a transparent; scrollbar-gutter: stable; }\n.song-list::-webkit-scrollbar { width: 8px; }\n.song-list::-webkit-scrollbar-track { background: transparent; }\n.song-list::-webkit-scrollbar-thumb { background: #4a4a4a; border: 2px solid #151515; border-radius: 999px; }\n.song-list::-webkit-scrollbar-thumb:hover { background: #676767; }\n.song-list::-webkit-scrollbar-corner { background: transparent; }"
          if old not in text:
              raise SystemExit('song-list scrollbar marker not found')
          sidebar.write_text(text.replace(old, new, 1))

          core = Path('src/app-editor-core.js')
          text = core.read_text()
          old = '''    function readTabRowFromDom(rowIndex) {
      const row = blankRow();
      document.querySelectorAll(`.note-input[data-row="${rowIndex}"]`).forEach(input => {
        const string = Number(input.dataset.string);
        const position = Number(input.dataset.position);
        if (!row[string] || position < 0 || position >= row[string].length) return;
        row[string][position] = normalizeTabValue(input.value);
      });
      return row;
    }

    function syncRhythmRowFromDom(rowIndex) {
      const song = currentSong();
      if (!song || previewSong) return;
      const rowCount = Math.max(song.rows?.length || 0, rowIndex + 1);
      if (!Array.isArray(song.rhythmRows)) song.rhythmRows = [];
      while (song.rhythmRows.length < rowCount) song.rhythmRows.push({});
      song.rhythmRows[rowIndex] = rhythmRowFromRow(readTabRowFromDom(rowIndex), song.beatsPerMeasure);
    }

    function renderRhythmNotation(rowIndex) {
'''
          new = '''    function readTabRowFromDom(rowIndex) {
      const row = blankRow();
      const grid = document.querySelector(`.tab-grid[data-row="${rowIndex}"]`);
      grid?.querySelectorAll('.note-input').forEach(input => {
        const string = Number(input.dataset.string);
        const position = Number(input.dataset.position);
        if (!row[string] || position < 0 || position >= row[string].length) return;
        row[string][position] = normalizeTabValue(input.value);
      });
      return row;
    }

    function syncRhythmRow(rowIndex, row) {
      const song = currentSong();
      if (!song || previewSong) return;
      const rowCount = Math.max(song.rows?.length || 0, rowIndex + 1);
      if (!Array.isArray(song.rhythmRows)) song.rhythmRows = [];
      while (song.rhythmRows.length < rowCount) song.rhythmRows.push({});
      song.rhythmRows[rowIndex] = rhythmRowFromRow(row, song.beatsPerMeasure);
    }

    const pendingRhythmRows = new Map();
    const rhythmRenderFrames = new Map();

    function scheduleRhythmNotation(rowIndex, row) {
      pendingRhythmRows.set(rowIndex, row);
      if (rhythmRenderFrames.has(rowIndex)) return;
      const frame = requestAnimationFrame(() => {
        rhythmRenderFrames.delete(rowIndex);
        const pendingRow = pendingRhythmRows.get(rowIndex);
        pendingRhythmRows.delete(rowIndex);
        renderRhythmNotation(rowIndex, pendingRow);
      });
      rhythmRenderFrames.set(rowIndex, frame);
    }

    function renderRhythmNotation(rowIndex, row = null) {
'''
          if old not in text:
              raise SystemExit('editor core row sync marker not found')
          text = text.replace(old, new, 1)

          old = "      const onsets = rhythmOnsetsFromRow(readTabRowFromDom(rowIndex), activeBeatsPerMeasure);"
          new = "      const onsets = rhythmOnsetsFromRow(row || readTabRowFromDom(rowIndex), activeBeatsPerMeasure);"
          if old not in text:
              raise SystemExit('rhythm onset marker not found')
          text = text.replace(old, new, 1)

          old = '''    function handleInput(event) {
      const input = event.target;
      input.value = normalizeTabValue(input.value);
      input.classList.toggle('has-value', input.value.length > 0);
      const rowIndex = Number(input.dataset.row);
      syncRhythmRowFromDom(rowIndex);
      jumpToInput(input, false);
      renderRhythmNotation(rowIndex);
      if (input.value.length === 2) focusRelative(input, 0, 1);
    }
'''
          new = '''    function handleInput(event) {
      const input = event.target;
      input.value = normalizeTabValue(input.value);
      input.classList.toggle('has-value', input.value.length > 0);
      const rowIndex = Number(input.dataset.row);
      const row = readTabRowFromDom(rowIndex);
      syncRhythmRow(rowIndex, row);
      jumpToInput(input, false);
      scheduleRhythmNotation(rowIndex, row);
      if (input.value.length === 2) focusRelative(input, 0, 1);
    }
'''
          if old not in text:
              raise SystemExit('handleInput marker not found')
          core.write_text(text.replace(old, new, 1))

          zones = Path('src/app-editor-insert-zones.js')
          text = zones.read_text()
          marker = '''  function commitStructure(rows, rhythmRows, counts, message) {
'''
          helper = '''  function measureHasNotes(measure) {
    return (measure?.notes || []).some(stringValues =>
      (stringValues || []).some(value => String(value || '').trim() !== '')
    );
  }

  function insertMeasureWithOverflow(rows, rhythmRows, counts, rowIndex, boundary, measure, replaceEmptyRow = false) {
    if (rowIndex >= rows.length) {
      rows.push(blankRow());
      rhythmRows.push({});
      counts.push(1);
      writeMeasuresToRow(rows, rhythmRows, rowIndex, [measure]);
      return;
    }

    const count = Math.max(1, Math.min(MEASURES, Number(counts[rowIndex]) || MEASURES));
    const measures = activeMeasures(rows, rhythmRows, rowIndex, count);
    if (replaceEmptyRow && measures.length === 1 && !measureHasNotes(measures[0])) {
      measures[0] = measure;
    } else {
      const target = Math.max(0, Math.min(measures.length, boundary));
      measures.splice(target, 0, measure);
    }

    const overflow = measures.length > MEASURES ? measures.pop() : null;
    counts[rowIndex] = Math.max(1, measures.length);
    writeMeasuresToRow(rows, rhythmRows, rowIndex, measures);
    if (overflow) insertMeasureWithOverflow(rows, rhythmRows, counts, rowIndex + 1, 0, overflow, true);
  }

'''
          if helper.strip() not in text:
              if marker not in text:
                  raise SystemExit('insert zones commit marker not found')
              text = text.replace(marker, helper + marker, 1)

          old = "    song.rhythmRows = rhythmRows;"
          new = "    song.rhythmRows = song.rows.map(row => rhythmRowFromRow(row, song.beatsPerMeasure));"
          if old not in text:
              raise SystemExit('insert zones rhythm assignment marker not found')
          text = text.replace(old, new, 1)

          old = '''    if (targetCount >= MEASURES) {
      showToast('目標列已滿 4 個小節');
      return;
    }

    const sourceMeasures = activeMeasures(rows, rhythmRows, sourceRow, sourceCount);
    const targetMeasures = activeMeasures(rows, rhythmRows, targetRow, targetCount);
    const [moved] = sourceMeasures.splice(sourceMeasure, 1);
    const target = Math.max(0, Math.min(targetMeasures.length, targetBoundary));
    targetMeasures.splice(target, 0, moved);

    if (sourceMeasures.length === 0) {
      sourceMeasures.push(blankMeasureModule());
      counts[sourceRow] = 1;
    } else {
      counts[sourceRow] = sourceMeasures.length;
    }
    counts[targetRow] = targetMeasures.length;

    writeMeasuresToRow(rows, rhythmRows, sourceRow, sourceMeasures);
    writeMeasuresToRow(rows, rhythmRows, targetRow, targetMeasures);
    commitStructure(rows, rhythmRows, counts, '已移動小節模塊');
'''
          new = '''    const sourceMeasures = activeMeasures(rows, rhythmRows, sourceRow, sourceCount);
    const [moved] = sourceMeasures.splice(sourceMeasure, 1);

    if (sourceMeasures.length === 0) {
      sourceMeasures.push(blankMeasureModule());
      counts[sourceRow] = 1;
    } else {
      counts[sourceRow] = sourceMeasures.length;
    }

    writeMeasuresToRow(rows, rhythmRows, sourceRow, sourceMeasures);
    insertMeasureWithOverflow(rows, rhythmRows, counts, targetRow, targetBoundary, moved, true);
    commitStructure(rows, rhythmRows, counts, '已移動小節模塊');
'''
          if old not in text:
              raise SystemExit('full target rejection block not found')
          zones.write_text(text.replace(old, new, 1))
          PY
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Commit fixes, remove workflow, clean temporary branch
        run: |
          rm .github/workflows/tmp-editor-perf-overflow-main.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/sidebar.css src/app-editor-core.js src/app-editor-insert-zones.js .github/workflows/tmp-editor-perf-overflow-main.yml
          git commit -m "fix: smooth editor input and cascade measure overflow"
          git push origin HEAD:main
          git push origin --delete fix/editor-performance-overflow-scrollbar || true
