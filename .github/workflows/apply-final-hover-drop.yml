name: Apply final hover drop rewrite
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/perf/final-hover-drop-and-ribbon-scroll'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/apply-final-hover-drop.py
      - run: npm test
      - run: npm run benchmark:editor-layout
      - run: npm run check
      - run: npm run build
      - name: Commit validated rewrite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-final-hover-drop.yml scripts/apply-final-hover-drop.py
          git add src/editor/structure-controller.js styles/responsive.css styles/editor-modules.css styles/editor-insert-zones.css styles/editor-row-controls.css tests/editor-structure-cleanup.test.mjs tests/ui-layout-regression.test.mjs
          git commit -m "perf: resolve structure drops only on release"
          git push origin HEAD:perf/final-hover-drop-and-ribbon-scroll
