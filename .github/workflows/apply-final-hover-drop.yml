name: Apply final hover drop rewrite
on:
  push:
    branches:
      - perf/final-hover-drop-and-ribbon-scroll
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/final-hover-drop-and-ribbon-scroll
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rewrite ribbon and structure drag paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          responsive = Path('styles/responsive.css')
          text = responsive.read_text()
          marker = '@media (max-width:1500px){.editor-view .editor-ribbon'
          block = '''@media (max-width:1500px){.editor-view .editor-ribbon{box-sizing:border-box;width:100%;max-width:100%;min-width:0;overflow:hidden}.editor-view .editor-ribbon-tabs{box-sizing:border-box;width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:none}.editor-view .editor-ribbon-tabs::-webkit-scrollbar{display:none;width:0;height:0}.editor-view .editor-ribbon-tab{flex:0 0 auto}.editor-view .editor-ribbon-panel{box-sizing:border-box;width:100%;max-width:100%;min-width:0;overflow:hidden}.editor-view .editor-ribbon-section{box-sizing:border-box;width:100%;max-width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:none}.editor-view .editor-ribbon-section::-webkit-scrollbar{display:none;width:0;height:0}}\n'''
          if marker not in text:
              anchor = '@media (max-width:980px)'
              if anchor not in text:
                  raise SystemExit('responsive anchor missing')
              text = text.replace(anchor, block + anchor, 1)
          responsive.write_text(text)

          structure = Path('src/editor/structure-controller.js')
          text = structure.read_text()
          text = text.replace('let activeDrop = null;\n', '')
          text, count = re.subn(
              r"\n  for \(let localBoundary = 0; localBoundary <= count; localBoundary\+\+\) \{\n    const line = document\.createElement\('div'\);\n    line\.className = 'measure-insert-boundary';\n    line\.dataset\.boundary = String\(start \+ localBoundary\);\n    line\.style\.left = `\$\{boundaryPercent\(grid, localBoundary\)\}%`;\n    grid\.appendChild\(line\);\n  \}\n",
              '\n', text, count=1
          )
          if count != 1:
              raise SystemExit(f'measure boundary loop replacements: {count}')

          start = text.find('function beginPointerDrag(')
          end = text.find('function installGlobalActions()')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('drag block anchors missing')
          drag_block = r'''function beginPointerDrag(event, state, sourceNode) {
  if (isEditingBlocked() || event.button !== 0 || dragPointer) return;
  event.preventDefault();
  dragState = state;
  dragPointer = {
    pointerId: event.pointerId,
    sourceNode,
    visualNode: state.type === 'row' ? sourceNode.closest('.editor-row-module') : sourceNode,
    startX: event.clientX,
    startY: event.clientY,
    active: false
  };
}

function dropElementAt(x, y) {
  return document.elementFromPoint(x, y);
}

function rowDropTargetFromElement(element, y) {
  const zone = element?.closest?.('.row-insert-zone');
  if (zone) {
    const index = Number(zone.dataset.insertIndex);
    return Number.isInteger(index) ? { index } : null;
  }
  const row = element?.closest?.('.editor-row-module');
  if (!row) return null;
  const rowIndex = Number(row.dataset.sourceRow ?? row.dataset.row);
  if (!Number.isInteger(rowIndex)) return null;
  const rect = row.getBoundingClientRect();
  return { index: rowIndex + (y >= rect.top + rect.height / 2 ? 1 : 0) };
}

function measureDropTargetFromElement(element, x) {
  const hitbox = element?.closest?.('.measure-module-hitbox');
  if (!hitbox) return null;
  const rowIndex = Number(hitbox.dataset.row);
  const measureIndex = Number(hitbox.dataset.measure);
  if (!Number.isInteger(rowIndex) || !Number.isInteger(measureIndex)) return null;
  const rect = hitbox.getBoundingClientRect();
  return {
    rowIndex,
    boundary: measureIndex + (x >= rect.left + rect.width / 2 ? 1 : 0)
  };
}

function commitDropAt(x, y) {
  const store = currentStore();
  if (!store || !dragState) return false;
  const element = dropElementAt(x, y);
  if (!element) return false;
  const documentModel = store.getDocument();
  if (dragState.type === 'row') {
    const target = rowDropTargetFromElement(element, y);
    if (!target) return false;
    return commitResult(moveSystem(documentModel, dragState.rowIndex, target.index), '已移動列');
  }
  if (dragState.type === 'measure') {
    const target = measureDropTargetFromElement(element, x);
    if (!target) return false;
    return commitResult(
      moveMeasureAt(documentModel, dragState.rowIndex, dragState.measureIndex, target.rowIndex, target.boundary),
      '已移動小節'
    );
  }
  return false;
}

function resetDrag() {
  dragPointer?.visualNode?.classList.remove('is-dragging');
  document.documentElement.classList.remove(
    'structure-drag-active',
    'structure-row-drag-active',
    'structure-measure-drag-active'
  );
  dragPointer = null;
  dragState = null;
}

function handlePointerMove(event) {
  if (!dragPointer || event.pointerId !== dragPointer.pointerId || isEditingBlocked()) return;
  if (!dragPointer.active) {
    const distance = Math.hypot(event.clientX - dragPointer.startX, event.clientY - dragPointer.startY);
    if (distance < 5) return;
    dragPointer.active = true;
    dragPointer.visualNode?.classList.add('is-dragging');
    document.documentElement.classList.add('structure-drag-active', `structure-${dragState.type}-drag-active`);
  }
  event.preventDefault();
}

function finishPointerDrag(event, cancelled = false) {
  if (!dragPointer || event.pointerId !== dragPointer.pointerId) return;
  const state = dragState;
  const active = dragPointer.active;
  if (active && !cancelled) {
    event.preventDefault();
    commitDropAt(event.clientX, event.clientY);
  } else if (!active && !cancelled && state) {
    if (state.type === 'row') setSelected({ type: 'row', rowIndex: state.rowIndex });
    else setSelected({ type: 'measure', rowIndex: state.rowIndex, measureIndex: state.measureIndex });
  }
  resetDrag();
}

function installDragHandlers() {
  document.addEventListener('pointermove', handlePointerMove, { capture: true, passive: false });
  document.addEventListener('pointerup', event => finishPointerDrag(event), true);
  document.addEventListener('pointercancel', event => finishPointerDrag(event, true), true);
  window.addEventListener('blur', resetDrag);
}

'''
          text = text[:start] + drag_block + text[end:]
          forbidden = ['activeDrop', 'clearDropUi', 'setActiveDrop', 'updateDropUi', 'elementsFromPoint', 'setPointerCapture', 'releasePointerCapture', 'measure-insert-boundary']
          leftovers = [token for token in forbidden if token in text]
          if leftovers:
              raise SystemExit(f'legacy drag leftovers: {leftovers}')
          structure.write_text(text)

          modules = Path('styles/editor-modules.css')
          lines = modules.read_text().splitlines()
          dead = (
              '.editor-row-module.drop-before', '.editor-row-module.drop-after',
              '.measure-module-hitbox::after', '.measure-module-hitbox.drop-before',
              '.measure-module-hitbox.drop-after'
          )
          lines = [line for line in lines if not any(token in line for token in dead)]
          insert_after = next((i for i, line in enumerate(lines) if line.startswith('.measure-module-hitbox:hover')), None)
          if insert_after is None:
              raise SystemExit('measure hover css anchor missing')
          lines.insert(insert_after + 1, '.structure-measure-drag-active .v3-column-target,.structure-measure-drag-active .v3-note,.structure-measure-drag-active .v3-note-editor,.structure-measure-drag-active .technique-marker{pointer-events:none!important}')
          modules.write_text('\n'.join(lines) + '\n')

          insert_css = Path('styles/editor-insert-zones.css')
          insert_css.write_text('.measure-module-badge{display:none!important}\n.content.edit-view .measure-line{z-index:2;pointer-events:none;background:#222}\n')

          row_css = Path('styles/editor-row-controls.css')
          row = row_css.read_text()
          row = row.replace(
              '.row-insert-zone:hover .row-insert-controls,.row-insert-zone:focus-within .row-insert-controls,.row-insert-zone.is-drag-target .row-insert-controls{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}',
              '.row-insert-zone:hover .row-insert-controls,.row-insert-zone:focus-within .row-insert-controls{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}'
          )
          row = '\n'.join(line for line in row.splitlines() if not any(token in line for token in (
              '.row-drag-active', '.row-insert-zone.is-drag-target'
          ))) + '\n'
          row = row.replace('@media(max-width:900px){.row-insert-zone::before,.row-insert-zone.is-drag-target::after{left:50px}}\n', '')
          row += '.structure-row-drag-active .row-insert-zone:hover::after{content:\'\';position:absolute;left:50px;right:8px;top:50%;height:3px;border-radius:2px;background:#1ed760;transform:translateY(-50%);pointer-events:none}\n'
          row += '@media(max-width:900px){.row-insert-zone::before,.structure-row-drag-active .row-insert-zone:hover::after{left:50px}}\n'
          row_css.write_text(row)

          structure_test = Path('tests/editor-structure-cleanup.test.mjs')
          test = structure_test.read_text()
          test = test.replace(
              "const headerCss=await readFile(new URL('../styles/header.css',import.meta.url),'utf8');\n",
              "const headerCss=await readFile(new URL('../styles/header.css',import.meta.url),'utf8');\nconst insertZoneCss=await readFile(new URL('../styles/editor-insert-zones.css',import.meta.url),'utf8');\nconst rowControlsCss=await readFile(new URL('../styles/editor-row-controls.css',import.meta.url),'utf8');\n"
          )
          old = """const dragUpdate=structureSource.slice(structureSource.indexOf('function hitAtPoint('),structureSource.indexOf('function commitDrop('));
assert.match(dragUpdate,/document\\.elementsFromPoint\\(x, y\\)/,'drag hover must hit-test only the current pointer location');
assert.doesNotMatch(dragUpdate,/querySelectorAll|dragGeometry/,'drag hover must never scan every row or measure boundary');
assert.match(structureSource,/document\\.addEventListener\\('pointermove'[\\s\\S]*handlePointerMove/s,'pointermove should drive hover feedback at pointer cadence');
assert.match(structureSource,/function finishPointerDrag\\(event[\\s\\S]*updateDropUi\\(event\\.clientX, event\\.clientY\\);[\\s\\S]*commitDrop\\(\\)/s,'the final pointer position must be resolved immediately before the document mutation');
assert.doesNotMatch(structureSource,/addEventListener\\('dragover'|captureDragGeometry|scheduleDropUi|pendingDragPoint|dragFrame/,'row and measure dragging must have one pointer-event implementation');
"""
          new = """const pointerMove=structureSource.slice(structureSource.indexOf('function handlePointerMove('),structureSource.indexOf('function finishPointerDrag('));
assert.doesNotMatch(pointerMove,/elementFromPoint|elementsFromPoint|getBoundingClientRect|querySelector/,'pointermove must only cross the drag threshold and let native hover follow the pointer');
assert.match(pointerMove,/Math\\.hypot[\\s\\S]*classList\\.add\\('structure-drag-active'/s,'pointermove should only activate the drag state after the movement threshold');
const dropResolution=structureSource.slice(structureSource.indexOf('function dropElementAt('),structureSource.indexOf('function resetDrag('));
assert.match(dropResolution,/document\\.elementFromPoint\\(x, y\\)/,'drop must resolve the element under the final pointer exactly once');
assert.equal((structureSource.match(/document\\.elementFromPoint\\(/g)||[]).length,1,'row and measure drag should share one final point lookup');
assert.match(structureSource,/function finishPointerDrag\\(event[\\s\\S]*commitDropAt\\(event\\.clientX, event\\.clientY\\)/s,'document mutation should happen only on pointer release');
assert.doesNotMatch(structureSource,/activeDrop|clearDropUi|setActiveDrop|updateDropUi|elementsFromPoint|setPointerCapture|releasePointerCapture|measure-insert-boundary|addEventListener\\('dragover'/,'legacy hover-target and native DnD paths must be deleted');
assert.doesNotMatch(insertZoneCss,/drop-before|drop-after|measure-insert-boundary|measure-drag-grip|is-drag-target|measure-insert-shift/,'legacy insertion drag CSS must be removed');
assert.doesNotMatch(rowControlsCss,/row-drag-active|is-drag-target|drop-before|drop-after/,'legacy row drop-target CSS must be removed');
assert.match(rowControlsCss,/structure-row-drag-active \\.row-insert-zone:hover::after/,'row drag feedback should use native CSS hover only');
"""
          if old not in test:
              raise SystemExit('structure drag test block missing')
          test = test.replace(old, new, 1)
          structure_test.write_text(test)

          ui_test = Path('tests/ui-layout-regression.test.mjs')
          ui = ui_test.read_text()
          anchor = "assert.match(responsiveCss,/\\.editor-ribbon-tabs\\{[^}]*width:100%[^}]*overflow-x:auto/s,'mobile ribbon tabs must remain horizontally reachable on narrow screens');\n"
          extra = "assert.match(responsiveCss,/@media \\(max-width:1500px\\)[\\s\\S]*\\.editor-view \\.editor-ribbon\\{[^}]*width:100%[^}]*overflow:hidden[\\s\\S]*\\.editor-view \\.editor-ribbon-section\\{[^}]*width:100%[^}]*overflow-x:auto/s,'narrow desktop and tablet ribbons must use a viewport-width scroll container');\n"
          if extra not in ui:
              if anchor not in ui:
                  raise SystemExit('ui ribbon test anchor missing')
              ui = ui.replace(anchor, anchor + extra, 1)
          ui_test.write_text(ui)
          PY
      - name: Run tests
        run: npm test
      - name: Run editor benchmark
        run: npm run benchmark:editor-layout
      - name: Run syntax check
        run: npm run check
      - name: Run production build
        run: npm run build
      - name: Commit validated rewrite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-final-hover-drop.yml
          git add src/editor/structure-controller.js styles/responsive.css styles/editor-modules.css styles/editor-insert-zones.css styles/editor-row-controls.css tests/editor-structure-cleanup.test.mjs tests/ui-layout-regression.test.mjs
          git commit -m "perf: resolve structure drops only on release"
          git push origin HEAD:perf/final-hover-drop-and-ribbon-scroll
