name: Run rhythm refactor

on:
  push:
    branches: [refactor/meter-aware-tab-beams]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical rhythm rewrite
        run: python .github/scripts/rhythm_refactor.py
      - name: Validate refactor
        run: |
          npm test
          npm run benchmark:editor-layout
          npm run check
          npm run build
      - name: Commit canonical changes
        run: |
          git rm .github/workflows/apply-rhythm-refactor.yml .github/workflows/run-rhythm-refactor.yml .github/scripts/rhythm_refactor.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/editor/renderer.js src/editor/rhythm-notation.js styles/editor-v3.css tests/editor-rhythm-polish.test.mjs
          git commit -m "refactor: make tab rhythm beams meter aware"
          git push origin HEAD:${GITHUB_REF_NAME}
