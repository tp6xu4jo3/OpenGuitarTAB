name: Run rhythm refactor

on:
  push:
    branches: [refactor/meter-aware-tab-beams]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite canonical rhythm notation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          renderer_path = Path('src/editor/renderer.js')
          css_path = Path('styles/editor-v3.css')
          test_path = Path('tests/editor-rhythm-polish.test.mjs')
          module_path = Path('src/editor/rhythm-notation.js')

          module_path.write_text(r'''import { fractionToNumber, normalizeFraction } from './model.js';

const EPSILON = 1e-9;
const DEFAULT_GRID_DURATION = 0.25;

function numericFraction(value) {
  if (typeof value === 'number' && Number.isFinite(value)) return value;
  return fractionToNumber(value);
}

function measureDurationInQuarterBeats(measure) {
  const signature = measure?.timeSignature || { numerator: 4, denominator: 4 };
  const numerator = Math.max(1, Math.trunc(Number(signature.numerator) || 4));
  const denominator = Math.max(1, Math.trunc(Number(signature.denominator) || 4));
  return numerator * (4 / denominator);
}

export function rhythmBeamCountForValue(value) {
  if (!Number.isFinite(value) || value >= 1) return 0;
  if (value >= 0.5) return 1;
  if (value >= 0.25) return 2;
  return 3;
}

export function rhythmDotCountForValue(value) {
  if (!Number.isFinite(value) || value <= 0) return 0;
  for (const base of [2, 1, 0.5, 0.25, 0.125]) {
    if (Math.abs(value - base * 1.5) <= EPSILON) return 1;
  }
  return 0;
}

function placeholderDurationForAt(at) {
  const normalized = normalizeFraction(at || [0, 1]);
  const denominator = Math.abs(Number(normalized[1])) || 1;
  return denominator === 1 ? 1 : denominator === 2 ? 0.5 : 0.25;
}

export function resolvedOrdinaryDurationValue(event, orderedEvents, measure) {
  const storedDuration = numericFraction(event?.duration || [1, 4]);
  const atValue = numericFraction(event?.at || [0, 1]);
  let duration = Math.abs(storedDuration - DEFAULT_GRID_DURATION) <= EPSILON
    ? placeholderDurationForAt(event?.at)
    : storedDuration;

  const next = (orderedEvents || []).find(candidate => numericFraction(candidate?.at || [0, 1]) > atValue + EPSILON);
  const nextAt = next ? numericFraction(next.at) : Number.POSITIVE_INFINITY;
  const measureEnd = measureDurationInQuarterBeats(measure);
  const boundary = Math.min(nextAt, measureEnd);
  if (Number.isFinite(boundary) && boundary > atValue + EPSILON) {
    duration = Math.min(duration, boundary - atValue);
  }
  return Math.max(0, duration);
}

function meterBeamGroupDurations(measure, beamLevel = 1) {
  const signature = measure?.timeSignature || { numerator: 4, denominator: 4 };
  const numerator = Math.max(1, Math.trunc(Number(signature.numerator) || 4));
  const denominator = Math.max(1, Math.trunc(Number(signature.denominator) || 4));
  const unit = 4 / denominator;

  if (denominator === 4 && numerator === 3 && beamLevel === 1) return [3];
  if (denominator >= 8) {
    if (numerator === 3) return [3 * unit];
    if (numerator > 3 && numerator % 3 === 0) return Array.from({ length: numerator / 3 }, () => 3 * unit);
    if (numerator === 5) return [2 * unit, 3 * unit];
    if (numerator === 7) return [2 * unit, 2 * unit, 3 * unit];
  }
  return Array.from({ length: numerator }, () => unit);
}

export function ordinaryBeamGroupKey(measure, at, beamLevel = 1) {
  const value = numericFraction(at);
  const pattern = meterBeamGroupDurations(measure, beamLevel);
  let start = 0;
  for (let index = 0; index < pattern.length; index += 1) {
    const end = start + pattern[index];
    if (value < end - EPSILON || index === pattern.length - 1) return `meter:${beamLevel}:${index}`;
    start = end;
  }
  return `meter:${beamLevel}:${Math.max(0, pattern.length - 1)}`;
}

export function rhythmsAreContiguous(left, right) {
  if (!left || !right) return false;
  const leftAt = numericFraction(left.at);
  const rightAt = numericFraction(right.at);
  const duration = Number(left.durationValue);
  return Number.isFinite(duration) && Math.abs(leftAt + duration - rightAt) <= EPSILON;
}

export function rhythmPointsCanBeam(left, right, measure, beamLevel = 1) {
  if (!left || !right || Number(left.beams) < beamLevel || Number(right.beams) < beamLevel) return false;
  const leftGroup = String(left.group?.id || '');
  const rightGroup = String(right.group?.id || '');
  if (leftGroup || rightGroup) return Boolean(leftGroup && leftGroup === rightGroup);
  if (ordinaryBeamGroupKey(measure, left.at, beamLevel) !== ordinaryBeamGroupKey(measure, right.at, beamLevel)) return false;
  return rhythmsAreContiguous(left, right);
}
''', encoding='utf-8')

          renderer = renderer_path.read_text(encoding='utf-8')
          import_anchor = "import { editableTimesForMeasure } from './rhythm-grid.js';\n"
          rhythm_import = """import { editableTimesForMeasure } from './rhythm-grid.js';
import {
  resolvedOrdinaryDurationValue,
  rhythmBeamCountForValue,
  rhythmDotCountForValue,
  rhythmPointsCanBeam
} from './rhythm-notation.js';
"""
          if import_anchor not in renderer:
            raise SystemExit('renderer import anchor not found')
          renderer = renderer.replace(import_anchor, rhythm_import, 1)

          helper_pattern = re.compile(r"function rhythmBeamCountForValue\(value\) \{.*?(?=function rhythmStemTopForEvent)", re.S)
          renderer, count = helper_pattern.subn('', renderer, count=1)
          if count != 1:
            raise SystemExit(f'rhythm helper block replacement count={count}')

          old_duration = 'const durationValue = inferredOrdinaryDurationValue(event, orderedEvents);'
          if old_duration not in renderer:
            raise SystemExit('ordinary duration call not found')
          renderer = renderer.replace(old_duration, 'const durationValue = resolvedOrdinaryDurationValue(event, orderedEvents, measure);', 1)

          point_anchor = "        dots: group?.type === 'tuplet' ? 0 : rhythmDotCountForValue(durationValue),\n        group,"
          if point_anchor not in renderer:
            raise SystemExit('rhythm point anchor not found')
          renderer = renderer.replace(point_anchor, "        dots: group?.type === 'tuplet' ? 0 : rhythmDotCountForValue(durationValue),\n        durationValue,\n        group,", 1)

          rhythm_start = renderer.index('  createRhythmLayer(measure, visualTimeByKey, geometry) {')
          beam_start = renderer.index('    const groups = new Map();', rhythm_start)
          beam_end = renderer.index('    for (const group of measure.groups || []) {', beam_start)
          new_beaming = r'''    points.forEach(point => {
      const stem = div('v3-rhythm-stem');
      stem.style.left = `${point.x}%`;
      stem.style.top = `${point.stemTop}px`;
      stem.style.height = `${Math.max(4, SCORE_STEM_END - point.stemTop)}px`;
      layer.appendChild(stem);
      if (point.dots > 0) {
        const dot = div('v3-rhythm-dot');
        dot.style.left = `${point.x}%`;
        layer.appendChild(dot);
      }
    });

    for (let index = 0; index + 1 < points.length; index += 1) {
      const point = points[index];
      const next = points[index + 1];
      const maxLevel = Math.min(point.beams, next.beams);
      for (let level = 1; level <= maxLevel; level += 1) {
        if (!rhythmPointsCanBeam(point, next, measure, level)) continue;
        const beam = div(`v3-rhythm-beam v3-rhythm-beam-${level}`);
        beam.style.left = `${point.x}%`;
        beam.style.width = `${Math.max(0.5, next.x - point.x)}%`;
        layer.appendChild(beam);
      }
    }

    points.forEach((point, index) => {
      if (point.beams <= 0) return;
      const previous = points[index - 1];
      const next = points[index + 1];
      const primaryPrevious = rhythmPointsCanBeam(previous, point, measure, 1);
      const primaryNext = rhythmPointsCanBeam(point, next, measure, 1);
      if (!primaryPrevious && !primaryNext) {
        for (let level = 1; level <= point.beams; level += 1) {
          const flag = div(`v3-rhythm-flag v3-rhythm-beam-${level}`);
          flag.style.left = `${point.x}%`;
          layer.appendChild(flag);
        }
        return;
      }
      for (let level = 2; level <= point.beams; level += 1) {
        const secondaryPrevious = rhythmPointsCanBeam(previous, point, measure, level);
        const secondaryNext = rhythmPointsCanBeam(point, next, measure, level);
        if (secondaryPrevious || secondaryNext) continue;
        const direction = primaryNext ? 'forward' : 'backward';
        const hook = div(`v3-rhythm-hook v3-rhythm-hook-${direction} v3-rhythm-beam-${level}`);
        hook.style.left = `${point.x}%`;
        layer.appendChild(hook);
      }
    });

'''
          renderer = renderer[:beam_start] + new_beaming + renderer[beam_end:]
          renderer_path.write_text(renderer, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          css_start = css.index('.v3-rhythm-beam,.v3-rhythm-flag{')
          css_end = css.index('.v3-rhythm-dot{', css_start)
          new_css = ".v3-rhythm-beam,.v3-rhythm-hook{position:absolute;box-sizing:border-box;height:var(--v3-rhythm-beam-thickness);border-radius:0;background:currentColor;transform-origin:left center}\n.v3-rhythm-flag{position:absolute;box-sizing:border-box;width:11px;height:var(--v3-rhythm-stroke);border-radius:999px;background:currentColor;transform:rotate(-38deg);transform-origin:left center}\n.v3-rhythm-beam-1{top:25px}.v3-rhythm-beam-2{top:16px}.v3-rhythm-beam-3{top:7px}\n.v3-rhythm-hook{width:10px;transform:none}.v3-rhythm-hook-backward{transform:translateX(-100%)}\n"
          css = css[:css_start] + new_css + css[css_end:]
          css_path.write_text(css, encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          test_import_anchor = "import { inflateSync } from 'node:zlib';\n"
          test_import = """import { inflateSync } from 'node:zlib';
import {
  ordinaryBeamGroupKey,
  resolvedOrdinaryDurationValue,
  rhythmPointsCanBeam
} from '../src/editor/rhythm-notation.js';
"""
          if test_import_anchor not in test:
            raise SystemExit('test import anchor not found')
          test = test.replace(test_import_anchor, test_import, 1)

          assertion_start = test.index("assert.match(renderer, /const groupBeamCount")
          assertion_end = test.index("assert.match(renderer, /const fullyBeamed", assertion_start)
          new_assertions = r'''assert.match(renderer, /const groupBeamCount = Number\(group\?\.beamCount\)[\s\S]*beams: Number\.isFinite\(groupBeamCount\)[\s\S]*rhythmBeamCountForValue\(durationValue\)/s, 'explicit triplet/subdivision beam counts must override ordinary duration inference');
const overlapMeasure = { timeSignature: { numerator: 4, denominator: 4 } };
const overlapEvents = [
  { at: [2, 1], duration: [1, 1] },
  { at: [5, 2], duration: [1, 2] }
];
assert.equal(resolvedOrdinaryDurationValue(overlapEvents[0], overlapEvents, overlapMeasure), 0.5, 'an ordinary single-voice note must stop at the next onset even when its stored duration is longer');
assert.equal(resolvedOrdinaryDurationValue({ at: [0, 1], duration: [1, 4] }, [{ at: [0, 1], duration: [1, 4] }], overlapMeasure), 1, 'default grid duration should still infer a quarter note on the downbeat when no earlier onset interrupts it');
assert.equal(ordinaryBeamGroupKey(overlapMeasure, 2, 1), ordinaryBeamGroupKey(overlapMeasure, 2.5, 1), 'eighth notes inside the same 4/4 beat should share the primary beam group');
assert.notEqual(ordinaryBeamGroupKey(overlapMeasure, 2.5, 1), ordinaryBeamGroupKey(overlapMeasure, 3, 1), '4/4 primary beams should break at the next beat');
const sixEight = { timeSignature: { numerator: 6, denominator: 8 } };
assert.equal(ordinaryBeamGroupKey(sixEight, 0, 1), ordinaryBeamGroupKey(sixEight, 1, 1), '6/8 should group the first three eighth notes as one dotted-quarter beat');
assert.notEqual(ordinaryBeamGroupKey(sixEight, 1, 1), ordinaryBeamGroupKey(sixEight, 1.5, 1), '6/8 should start a new beam group at the second dotted-quarter beat');
const threeFour = { timeSignature: { numerator: 3, denominator: 4 } };
assert.equal(ordinaryBeamGroupKey(threeFour, 0, 1), ordinaryBeamGroupKey(threeFour, 2.5, 1), '3/4 primary eighth-note beams may span the bar');
assert.notEqual(ordinaryBeamGroupKey(threeFour, 0, 2), ordinaryBeamGroupKey(threeFour, 1, 2), '3/4 secondary beams should still reveal quarter-note beat structure');
const beamedLeft = { at: 2, durationValue: 0.5, beams: 1, group: null };
const beamedRight = { at: 2.5, durationValue: 0.5, beams: 1, group: null };
assert.equal(rhythmPointsCanBeam(beamedLeft, beamedRight, overlapMeasure, 1), true, 'contiguous eighths in one beat should beam together');
assert.equal(rhythmPointsCanBeam(beamedLeft, { ...beamedRight, at: 2.75 }, overlapMeasure, 1), false, 'implicit rhythmic gaps should not be bridged by a beam');
assert.match(renderer, /v3-rhythm-hook v3-rhythm-hook-\$\{direction\}/, 'mixed eighth/sixteenth groups should use directional secondary beam hooks');
assert.match(editorCss, /--v3-rhythm-stroke:2px;--v3-rhythm-beam-thickness:5px/, 'beams should be visually heavier than stems');
assert.match(editorCss, /\.v3-rhythm-flag\{[^}]*rotate\(-38deg\)/, 'isolated short notes should use a real angled flag instead of a horizontal beamlet');
assert.match(editorCss, /\.v3-rhythm-hook-backward\{transform:translateX\(-100%\)\}/, 'secondary beam hooks should be able to point backward toward the primary beam group');
'''
          test = test[:assertion_start] + new_assertions + test[assertion_end:]
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Validate refactor
        run: |
          npm test
          npm run check
          npm run build
      - name: Commit canonical changes
        run: |
          git rm .github/workflows/apply-rhythm-refactor.yml .github/workflows/run-rhythm-refactor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/editor/renderer.js src/editor/rhythm-notation.js styles/editor-v3.css tests/editor-rhythm-polish.test.mjs
          git commit -m "refactor: make tab rhythm beams meter aware"
          git push origin HEAD:${GITHUB_REF_NAME}
