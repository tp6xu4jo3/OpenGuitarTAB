name: Run rhythm refactor

on:
  push:
    branches: [refactor/meter-aware-tab-beams]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical rhythm rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-rhythm-refactor.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(lines) if line == '          from pathlib import Path')
          end = next(index for index in range(start + 1, len(lines)) if lines[index] == '          PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          exec(compile(code, str(path), 'exec'))
          PY
      - name: Commit canonical changes
        run: |
          git rm .github/workflows/apply-rhythm-refactor.yml .github/workflows/run-rhythm-refactor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/editor/renderer.js src/editor/rhythm-notation.js styles/editor-v3.css tests/editor-rhythm-polish.test.mjs
          git commit -m "refactor: make tab rhythm beams meter aware"
          git push origin HEAD:${GITHUB_REF_NAME}
