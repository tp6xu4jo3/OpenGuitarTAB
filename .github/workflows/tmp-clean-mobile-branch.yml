name: One-time mobile branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ contains(github.event.head_commit.message, 'run one-time mobile branch cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete merged branch and remove this workflow
        shell: bash
        run: |
          git push origin --delete fix/mobile-catalog-layout || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-clean-mobile-branch.yml
          git commit -m "chore: remove temporary mobile branch cleanup workflow"
          git push origin HEAD:main
