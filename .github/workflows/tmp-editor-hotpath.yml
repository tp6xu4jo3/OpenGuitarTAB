name: Temporary editor hotpath fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch editor hot paths
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/app-editor-modules.js')
          s = p.read_text()
          s = s.replace("""    writeStorage();
    renderRows(song.rows);
    renderSongList();
    renderLibraryGrid();
""", """    renderRows(song.rows);
""", 1)
          s = s.replace("""  function deleteSelectedRow(rowIndex) {
