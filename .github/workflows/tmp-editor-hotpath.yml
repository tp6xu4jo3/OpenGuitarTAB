""")
          s = s.replace("""  addTabSystem = function enhancedAddTabSystem() { insertRowAt(readRowsFromDom().length); };
  removeLastTabSystem = function enhancedRemoveLastTabSystem() {
    const rows = readRowsFromDom();
    if (rows.length > 1) deleteSelectedRow(rows.length - 1);
  };
""", """  addTabSystem = function enhancedAddTabSystem() { insertRowAt(currentSong()?.rows?.length || 0); };
  removeLastTabSystem = function enhancedRemoveLastTabSystem() {
    const rowCount = currentSong()?.rows?.length || 0;
    if (rowCount > 1) deleteSelectedRow(rowCount - 1);
  };
""")
          p.write_text(s)

          p = Path('src/app-editor-row-controls.js')
          s = p.read_text()
          s = s.replace("""    writeStorage();
    renderRows(song.rows);
    renderSongList();
    renderLibraryGrid();
""", """    renderRows(song.rows);
""")
          s = s.replace("""    const rows = readRowsFromDom();
    const rhythmRows = rhythmRowsFor(rows.length);
""", """    const rows = deepClone(currentSong()?.rows || []);
    const rhythmRows = rhythmRowsFor(rows.length);
""", 1)
          p.write_text(s)

          Path('src/app-editor-fast-drag.js').write_text(r'''(() => {
  let drag = null;
  let grids = [];
  let active = null;
  let activeLine = null;
  let shifted = [];
  let raf = 0;
  let point = null;

  const countsFor = n => {
    const counts = ensureRowMeasureCounts(currentSong());
    return Array.from({ length: n }, (_, i) => counts[i] || MEASURES);
  };
  const rhythmRowsFor = n => Array.from({ length: n }, (_, i) => deepClone(currentSong()?.rhythmRows?.[i] || {}));

  function extractMeasure(rows, rowIndex, measureIndex) {
    const width = slotsPerMeasure();
    const start = measureIndex * width;
    return { notes: Array.from({ length: STRINGS }, (_, string) => rows[rowIndex][string].slice(start, start + width)) };
  }
  function measuresFor(rows, rowIndex, count) {
    return Array.from({ length: count }, (_, i) => extractMeasure(rows, rowIndex, i));
  }
  function writeMeasures(rows, rowIndex, measures) {
    const width = slotsPerMeasure();
    rows[rowIndex] = blankRow();
    measures.slice(0, MEASURES).forEach((measure, mi) => {
      for (let string = 0; string < STRINGS; string++) {
        const values = measure.notes?.[string] || [];
        for (let p = 0; p < width; p++) rows[rowIndex][string][mi * width + p] = normalizeTabValue(values[p]);
      }
    });
  }
  const hasNotes = measure => (measure?.notes || []).some(values => (values || []).some(value => String(value || '').trim()));
  function cascadeInsert(rows, counts, rowIndex, boundary, measure, replaceEmpty = false) {
    if (rowIndex >= rows.length) {
      rows.push(blankRow());
      counts.push(1);
      writeMeasures(rows, rowIndex, [measure]);
      return;
    }
    const count = Math.max(1, Math.min(MEASURES, Number(counts[rowIndex]) || MEASURES));
    const measures = measuresFor(rows, rowIndex, count);
    if (replaceEmpty && measures.length === 1 && !hasNotes(measures[0])) measures[0] = measure;
    else measures.splice(Math.max(0, Math.min(measures.length, boundary)), 0, measure);
    const overflow = measures.length > MEASURES ? measures.pop() : null;
    counts[rowIndex] = Math.max(1, measures.length);
    writeMeasures(rows, rowIndex, measures);
    if (overflow) cascadeInsert(rows, counts, rowIndex + 1, 0, overflow, true);
  }
  function clearVisual() {
    activeLine?.classList.remove('is-active');
    activeLine = null;
    shifted.forEach(node => node.classList.remove('measure-insert-shift'));
    shifted = [];
  }
  function cacheGeometry() {
    grids = Array.from(document.querySelectorAll('.tab-grid[data-row]')).map(grid => {
      const r = grid.getBoundingClientRect();
      const row = Number(grid.dataset.row);
      const count = Number(grid.dataset.measureCount) || rowMeasureCount(row);
      return { row, count, left:r.left, right:r.right, top:r.top, bottom:r.bottom,
        boundaries:Array.from(grid.querySelectorAll('.measure-insert-boundary')),
        hitboxes:Array.from(grid.querySelectorAll('.measure-module-hitbox')) };
    });
  }
  function targetAt(x, y) {
    const g = grids.find(item => y >= item.top && y <= item.bottom && x >= item.left && x <= item.right);
    if (!g) return null;
    const ratio = Math.max(0, Math.min(1, (x - g.left) / Math.max(1, g.right - g.left)));
    return { ...g, boundary: Math.max(0, Math.min(g.count, Math.round(ratio * g.count))) };
  }
  function showTarget(next) {
    if (active && next && active.row === next.row && active.boundary === next.boundary) return;
    clearVisual(); active = next; if (!next) return;
    activeLine = next.boundaries.find(node => Number(node.dataset.boundary) === next.boundary) || null;
    activeLine?.classList.add('is-active');
    shifted = next.hitboxes.filter(node => Number(node.dataset.measure) >= next.boundary);
    shifted.forEach(node => node.classList.add('measure-insert-shift'));
  }
  function schedule(x, y) {
    point = {x,y};
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; const p = point; point = null; if (p) showTarget(targetAt(p.x,p.y)); });
  }
  function commitMove() {
    if (!drag || !active) return;
    const song = currentSong();
    if (!song || previewSong) return;
    const rows = deepClone(song.rows || []);
    const counts = countsFor(rows.length);
    if (!rows[drag.row] || drag.measure < 0 || drag.measure >= counts[drag.row]) return;
    if (drag.row === active.row) {
      const measures = measuresFor(rows, drag.row, counts[drag.row]);
      const [moved] = measures.splice(drag.measure,1);
      let at = active.boundary;
      if (drag.measure < at) at--;
      at = Math.max(0, Math.min(measures.length, at));
      if (at === drag.measure) return;
      measures.splice(at,0,moved);
      writeMeasures(rows, drag.row, measures);
    } else {
      const source = measuresFor(rows, drag.row, counts[drag.row]);
      const [moved] = source.splice(drag.measure,1);
      if (!source.length) {
        source.push({notes:Array.from({length:STRINGS},()=>Array(slotsPerMeasure()).fill(''))});
        counts[drag.row]=1;
      } else counts[drag.row]=source.length;
      writeMeasures(rows, drag.row, source);
      cascadeInsert(rows, counts, active.row, active.boundary, moved, true);
    }
    song.rows = normalizeRows(rows, song.beatsPerMeasure);
    song.rhythmRows = song.rows.map(row => rhythmRowFromRow(row, song.beatsPerMeasure));
    song.rowMeasureCounts = Array.from({length:song.rows.length},(_,i)=>Math.max(1,Math.min(MEASURES,Number(counts[i])||MEASURES)));
    song.updatedAt = Date.now();
    renderRows(song.rows);
    showToast('已移動小節');
  }

  window.addEventListener('dragstart', event => {
    const source = event.target.closest?.('.measure-drag-grip,.measure-module-hitbox');
    if (!source || scoreViewEnabled || previewSong) return;
    event.stopPropagation();
    drag = {row:Number(source.dataset.row),measure:Number(source.dataset.measure)};
    active = null;
    clearVisual();
    cacheGeometry();
    document.body.classList.add('measure-drag-active');
    if (event.dataTransfer) {
      event.dataTransfer.effectAllowed='move';
      event.dataTransfer.setData('text/plain',`measure:${drag.row}:${drag.measure}`);
    }
  }, true);
  window.addEventListener('dragover', event => {
    if (!drag) return;
    event.preventDefault(); event.stopPropagation();
    if (event.dataTransfer) event.dataTransfer.dropEffect='move';
    schedule(event.clientX,event.clientY);
  }, true);
  window.addEventListener('drop', event => {
    if (!drag) return;
    event.preventDefault(); event.stopPropagation();
    if (raf) { cancelAnimationFrame(raf); raf=0; }
    if (point) { active=targetAt(point.x,point.y); point=null; }
    commitMove();
    drag=null; active=null; grids=[]; clearVisual(); document.body.classList.remove('measure-drag-active');
  }, true);
  window.addEventListener('dragend', () => {
    if (!drag) return;
    drag=null; active=null; grids=[]; point=null;
    if (raf) { cancelAnimationFrame(raf); raf=0; }
    clearVisual(); document.body.classList.remove('measure-drag-active');
  }, true);
})();
''')

          p = Path('src/bootstrap.js')
          s = p.read_text()
          needle = "  './src/app-editor-drag-grip.js',\n  './src/app-editor-performance.js',"
          if needle not in s:
            raise SystemExit('bootstrap insertion point not found')
          p.write_text(s.replace(needle, "  './src/app-editor-drag-grip.js',\n  './src/app-editor-fast-drag.js',\n  './src/app-editor-performance.js',"))

          for name in ['noop.txt','tmp.txt','oops.txt','really.tmp','stop.tmp','why.tmp']:
            Path(name).unlink(missing_ok=True)
          PY
      - run: npm test
      - run: npm run check
