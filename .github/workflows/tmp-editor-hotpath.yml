          # Replace the expensive document-level measure drag tracker with a cached,
          # requestAnimationFrame-throttled version. Row dragging keeps the old path.
          p = Path('src/app-editor-fast-drag.js')
          p.write_text(r'''(() => {
  let state = null;
  let geometry = [];
  let target = null;
  let frame = 0;
  let pendingPoint = null;
  let activeBoundary = null;
  let shifted = [];

  function rhythmRowsFor(rowCount) {
    const source = currentSong()?.rhythmRows;
    return Array.from({ length: rowCount }, (_, index) => deepClone(source?.[index] || {}));
  }

  function countsFor(rowCount) {
    const counts = ensureRowMeasureCounts(currentSong());
    return Array.from({ length: rowCount }, (_, index) => counts[index] || MEASURES);
  }

  function extractMeasure(rows, rhythmRows, rowIndex, measureIndex) {
    const width = slotsPerMeasure();
    const start = measureIndex * width;
    const notes = Array.from({ length: STRINGS }, (_, string) => rows[rowIndex][string].slice(start, start + width));
    const rhythm = {};
    for (const [rawPosition, rawDuration] of Object.entries(rhythmRows[rowIndex] || {})) {
      const position = Number(rawPosition);
      if (position >= start && position < start + width) rhythm[position - start] = Number(rawDuration);
    }
    return { notes, rhythm };
  }

  function activeMeasures(rows, rhythmRows, rowIndex, count) {
    return Array.from({ length: count }, (_, measureIndex) => extractMeasure(rows, rhythmRows, rowIndex, measureIndex));
  }

  function writeMeasuresToRow(rows, rhythmRows, rowIndex, measures) {
    const width = slotsPerMeasure();
    rows[rowIndex] = blankRow();
    rhythmRows[rowIndex] = {};
    measures.slice(0, MEASURES).forEach((measure, measureIndex) => {
      const offset = measureIndex * width;
      for (let string = 0; string < STRINGS; string++) {
        const values = measure.notes?.[string] || [];
        for (let position = 0; position < width; position++) rows[rowIndex][string][offset + position] = normalizeTabValue(values[position]);
      }
    });
  }

  function measureHasNotes(measure) {
    return (measure?.notes || []).some(values => (values || []).some(value => String(value || '').trim() !== ''));
  }

  function insertWithOverflow(rows, rhythmRows, counts, rowIndex, boundary, measure, replaceEmpty = false) {
    if (rowIndex >= rows.length) {
      rows.push(blankRow());
      rhythmRows.push({});
      counts.push(1);
      writeMeasuresToRow(rows, rhythmRows, rowIndex, [measure]);
      return;
    }
    const count = Math.max(1, Math.min(MEASURES, Number(counts[rowIndex]) || MEASURES));
    const measures = activeMeasures(rows, rhythmRows, rowIndex, count);
    if (replaceEmpty && measures.length === 1 && !measureHasNotes(measures[0])) measures[0] = measure;
    else measures.splice(Math.max(0, Math.min(measures.length, boundary)), 0, measure);
    const overflow = measures.length > MEASURES ? measures.pop() : null;
    counts[rowIndex] = Math.max(1, measures.length);
    writeMeasuresToRow(rows, rhythmRows, rowIndex, measures);
    if (overflow) insertWithOverflow(rows, rhythmRows, counts, rowIndex + 1, 0, overflow, true);
  }

  function clearVisual() {
    activeBoundary?.classList.remove('is-active');
    activeBoundary = null;
    shifted.forEach(node => node.classList.remove('measure-insert-shift'));
    shifted = [];
  }

  function cacheGeometry() {
    geometry = Array.from(document.querySelectorAll('.tab-grid[data-row]')).map(grid => {
      const rect = grid.getBoundingClientRect();
      const row = Number(grid.dataset.row);
      const count = Number(grid.dataset.measureCount) || rowMeasureCount(row);
      return {
        grid,
        row,
        count,
        left: rect.left,
        right: rect.right,
        top: rect.top,
        bottom: rect.bottom,
        boundaries: Array.from(grid.querySelectorAll('.measure-insert-boundary')),
        hitboxes: Array.from(grid.querySelectorAll('.measure-module-hitbox'))
      };
    });
  }

  function targetAt(x, y) {
    const item = geometry.find(g => y >= g.top && y <= g.bottom && x >= g.left && x <= g.right);
    if (!item) return null;
    const width = Math.max(1, item.right - item.left);
    const ratio = Math.max(0, Math.min(1, (x - item.left) / width));
    const boundary = Math.max(0, Math.min(item.count, Math.round(ratio * item.count)));
    return { ...item, boundary };
  }

  function renderTarget(next) {
    if (target && next && target.row === next.row && target.boundary === next.boundary) return;
    clearVisual();
    target = next;
    if (!next) return;
    activeBoundary = next.boundaries.find(node => Number(node.dataset.boundary) === next.boundary) || null;
    activeBoundary?.classList.add('is-active');
    shifted = next.hitboxes.filter(hitbox => Number(hitbox.dataset.measure) >= next.boundary);
    shifted.forEach(node => node.classList.add('measure-insert-shift'));
  }

  function scheduleTarget(x, y) {
    pendingPoint = { x, y };
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      const point = pendingPoint;
      pendingPoint = null;
      if (point) renderTarget(targetAt(point.x, point.y));
    });
  }

  function commitMove() {
    if (!state || !target) return;
    const song = currentSong();
    if (!song || previewSong) return;
    const rows = deepClone(song.rows || []);
    const rhythmRows = rhythmRowsFor(rows.length);
    const counts = countsFor(rows.length);
    const sourceRow = state.sourceRow;
    const sourceMeasure = state.sourceMeasure;
    if (!rows[sourceRow] || sourceMeasure < 0 || sourceMeasure >= counts[sourceRow]) return;

    if (sourceRow === target.row) {
      const measures = activeMeasures(rows, rhythmRows, sourceRow, counts[sourceRow]);
      const [moved] = measures.splice(sourceMeasure, 1);
      let insertAt = target.boundary;
      if (sourceMeasure < insertAt) insertAt -= 1;
      insertAt = Math.max(0, Math.min(measures.length, insertAt));
      if (insertAt === sourceMeasure) return;
      measures.splice(insertAt, 0, moved);
      writeMeasuresToRow(rows, rhythmRows, sourceRow, measures);
    } else {
      const sourceMeasures = activeMeasures(rows, rhythmRows, sourceRow, counts[sourceRow]);
      const [moved] = sourceMeasures.splice(sourceMeasure, 1);
      if (sourceMeasures.length === 0) {
        sourceMeasures.push({ notes: Array.from({ length: STRINGS }, () => Array(slotsPerMeasure()).fill('')), rhythm: {} });
        counts[sourceRow] = 1;
      } else counts[sourceRow] = sourceMeasures.length;
      writeMeasuresToRow(rows, rhythmRows, sourceRow, sourceMeasures);
      insertWithOverflow(rows, rhythmRows, counts, target.row, target.boundary, moved, true);
    }

    song.rows = normalizeRows(rows, song.beatsPerMeasure);
    song.rhythmRows = song.rows.map(row => rhythmRowFromRow(row, song.beatsPerMeasure));
    song.rowMeasureCounts = Array.from({ length: song.rows.length }, (_, index) => Math.max(1, Math.min(MEASURES, Number(counts[index]) || MEASURES)));
    song.updatedAt = Date.now();
    renderRows(song.rows);
    showToast('已移動小節');
  }

  window.addEventListener('dragstart', event => {
    const source = event.target.closest?.('.measure-drag-grip,.measure-module-hitbox');
    if (!source || scoreViewEnabled || previewSong) return;
    event.stopPropagation();
    state = { sourceRow: Number(source.dataset.row), sourceMeasure: Number(source.dataset.measure) };
    target = null;
    clearVisual();
    cacheGeometry();
    document.body.classList.add('measure-drag-active');
    if (event.dataTransfer) {
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', `measure:${state.sourceRow}:${state.sourceMeasure}`);
    }
  }, true);

  window.addEventListener('dragover', event => {
    if (!state) return;
    event.preventDefault();
    event.stopPropagation();
    if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
    scheduleTarget(event.clientX, event.clientY);
  }, true);

  window.addEventListener('drop', event => {
    if (!state) return;
    event.preventDefault();
    event.stopPropagation();
    if (frame) { cancelAnimationFrame(frame); frame = 0; }
    if (pendingPoint) {
      target = targetAt(pendingPoint.x, pendingPoint.y);
      pendingPoint = null;
    }
    commitMove();
    state = null;
    target = null;
    geometry = [];
    clearVisual();
    document.body.classList.remove('measure-drag-active');
  }, true);

  window.addEventListener('dragend', () => {
    if (!state) return;
    state = null;
    target = null;
    geometry = [];
    pendingPoint = null;
    if (frame) { cancelAnimationFrame(frame); frame = 0; }
    clearVisual();
    document.body.classList.remove('measure-drag-active');
  }, true);
})();
''')

          p = Path('src/bootstrap.js')
          s = p.read_text()
          needle = "  './src/app-editor-drag-grip.js',\n  './src/app-editor-performance.js',"
          replacement = "  './src/app-editor-drag-grip.js',\n  './src/app-editor-fast-drag.js',\n  './src/app-editor-performance.js',"
          if needle not in s:
            raise SystemExit('bootstrap insertion point not found')
          p.write_text(s.replace(needle, replacement))
