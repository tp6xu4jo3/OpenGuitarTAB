      - name: Commit final patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-editor-hotpath.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: optimize editor structure and drag hot paths"
          git push origin HEAD:main
