name: Temporary rhythm sync fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-sync-rhythm-from-tab.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/tmp-sync-rhythm.py
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Commit fix and remove temporary files
        run: |
          rm .github/workflows/tmp-sync-rhythm-from-tab.yml
          rm scripts/tmp-sync-rhythm.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app-editor-core.js src/app-editor-modules.js .github/workflows/tmp-sync-rhythm-from-tab.yml scripts/tmp-sync-rhythm.py
          git commit -m "fix: keep TAB notes and rhythm data synchronized"
          git push
