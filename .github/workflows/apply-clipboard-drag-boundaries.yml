name: Apply clipboard and drag boundary rewrite

on:
  push:
    branches: [fix/clipboard-relations-drag-boundaries]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage clipboard and drag boundary rewrite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clipboard-relations-drag-boundaries
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rewrite canonical clipboard and drag modules
        run: python scripts/apply-clipboard-drag-boundaries.py
      - run: npm test
      - run: npm run benchmark:editor-layout
      - run: npm run check
      - run: npm run build
      - name: Commit validated rewrite
        shell: bash
        run: |
          rm .github/workflows/apply-clipboard-drag-boundaries.yml scripts/apply-clipboard-drag-boundaries.py
          git config user.name "tp6xu4jo3"
          git config user.email "163460843+tp6xu4jo3@users.noreply.github.com"
          git add src/editor/clipboard.js src/editor/structure-controller.js styles/editor-modules.css styles/editor-row-controls.css tests/editor-v3.test.mjs tests/editor-structure-cleanup.test.mjs .github/workflows/apply-clipboard-drag-boundaries.yml scripts/apply-clipboard-drag-boundaries.py
          git commit -m "fix: preserve technique relations and canonicalize drag boundaries"
          git push origin HEAD:fix/clipboard-relations-drag-boundaries
