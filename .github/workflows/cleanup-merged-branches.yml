name: One-time merged branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete merged and temporary branches
        run: |
          git push origin --delete \
            feat/owner-public-permissions \
            fix/unlist-menu-contrast \
            chore/remove-legacy-repo-files \
            chore/remove-legacy-repo-files-copy \
            tmp-cleanup \
            tmp-cleanup-2 \
            tmp-cleanup-3
