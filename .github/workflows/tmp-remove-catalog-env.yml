name: Temporary catalog/env cleanup

on:
  push:
    branches:
      - chore/remove-catalog-env

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'remove catalog fallback and env example') && !contains(github.event.head_commit.message, 'remove temporary cleanup workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-catalog-env
      - name: Remove catalog fallback dependency and files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('api/index.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace("import { readFileSync } from 'node:fs';\n", "")

          text, count = re.subn(
              r"\nconst STATIC_CATALOG = new Map\(\n  JSON\.parse\(readFileSync\(new URL\('\.\./public/catalog/index\.json', import\.meta\.url\), 'utf8'\)\)\n    \.map\(song => \[String\(song\.id\), song\]\)\n\);\n",
              "\n",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('STATIC_CATALOG block not found exactly once')

          text, count = re.subn(
              r"\nfunction withStaticCatalogMetadata\(song\) \{\n  const fallback = STATIC_CATALOG\.get\(String\(song\?\.id \|\| ''\)\) \|\| \{\};\n  return \{\n    \.\.\.song,\n    artist: song\?\.artist \|\| fallback\.artist \|\| '',\n    album: song\?\.album \|\| fallback\.album \|\| '',\n    cover: song\?\.cover \|\| fallback\.cover \|\| ''\n  \};\n\}\n",
              "\n",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('withStaticCatalogMetadata function not found exactly once')

          text = text.replace('const enriched = withStaticCatalogMetadata(song);', 'const enriched = song || {};')
          text = text.replace('attachFileMeta(withStaticCatalogMetadata(entry.song), entry.file)', 'attachFileMeta(entry.song, entry.file)')
          text = text.replace('structuredClone(withStaticCatalogMetadata(entry.song))', 'structuredClone(entry.song)')

          if 'STATIC_CATALOG' in text or 'withStaticCatalogMetadata' in text or 'public/catalog/index.json' in text:
              raise SystemExit('legacy catalog fallback reference still remains')

          path.write_text(text, encoding='utf-8')
          PY

          rm -f public/catalog/index.json .env.example
          rmdir public/catalog 2>/dev/null || true
          rmdir public 2>/dev/null || true

          npm test
          npm run check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: remove catalog fallback and env example"
          git push origin HEAD:chore/remove-catalog-env
