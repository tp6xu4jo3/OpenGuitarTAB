name: Refine pointer drop targets
on: [push]
permissions:
  contents: write
jobs:
  refine:
    if: github.ref == 'refs/heads/perf/native-pointer-drag-indicators'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use pointerup event target directly
        run: |
          python - <<'PY'
          from pathlib import Path
          structure = Path('src/editor/structure-controller.js')
          text = structure.read_text()
          old = """function dropElementAt(x, y) {\n  return document.elementFromPoint(x, y);\n}\n\n"""
          if old not in text:
              raise SystemExit('dropElementAt block missing')
          text = text.replace(old, '', 1)
          old = """function commitDropAt(x, y) {\n  const store = currentStore();\n  if (!store || !dragState) return false;\n  const element = dropElementAt(x, y);\n  if (!element) return false;\n"""
          new = """function commitDropFromElement(element) {\n  const store = currentStore();\n  if (!store || !dragState || !element) return false;\n"""
          if old not in text:
              raise SystemExit('commitDropAt block missing')
          text = text.replace(old, new, 1)
          old = '    commitDropAt(event.clientX, event.clientY);'
          new = '    commitDropFromElement(event.target);'
          if old not in text:
              raise SystemExit('pointerup commit call missing')
          text = text.replace(old, new, 1)
          structure.write_text(text)

          test_path = Path('tests/editor-structure-cleanup.test.mjs')
          test = test_path.read_text()
          old = """const dropResolution=structureSource.slice(structureSource.indexOf('function dropElementAt('),structureSource.indexOf('function resetDrag('));\nassert.match(dropResolution,/document\\.elementFromPoint\\(x, y\\)/,'drop must resolve the element under the final pointer exactly once');\nassert.equal((structureSource.match(/document\\.elementFromPoint\\(/g)||[]).length,1,'row and measure drag should share one final point lookup');\nassert.match(structureSource,/function finishPointerDrag\\(event[\\s\\S]*commitDropAt\\(event\\.clientX, event\\.clientY\\)/s,'document mutation should happen only on pointer release');\n"""
          new = """const dropResolution=structureSource.slice(structureSource.indexOf('function rowDropTargetFromElement('),structureSource.indexOf('function resetDrag('));\nassert.doesNotMatch(structureSource,/document\\.elementFromPoint|document\\.elementsFromPoint/,'structure dragging must use the browser-resolved pointer event target without extra hit-testing');\nassert.match(structureSource,/function finishPointerDrag\\(event[\\s\\S]*commitDropFromElement\\(event\\.target\\)/s,'document mutation should use the final pointerup target directly');\n"""
          if old not in test:
              raise SystemExit('old final-hit-test assertions missing')
          test_path.write_text(test.replace(old, new, 1))
          PY
      - run: npm test
      - run: npm run benchmark:editor-layout
      - run: npm run check
      - run: npm run build
      - name: Commit refined implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-pointer-drop-targets.yml
          git add src/editor/structure-controller.js tests/editor-structure-cleanup.test.mjs
          git commit -m "perf: use direct pointerup targets for structure drops"
          git push origin HEAD:perf/native-pointer-drag-indicators
