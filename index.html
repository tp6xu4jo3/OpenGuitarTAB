<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="icon" href="./assets/OpenGuitarTABicon.ico" sizes="64x64" />
  <title>OpenGuitarTAB</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div class="app-shell">
    <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="開啟導覽選單" aria-controls="sidebar" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <aside class="sidebar" id="sidebar" aria-label="主要導覽">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true"><img src="./assets/OpenGuitarTABicon.ico" alt="" /></div>
        <div class="brand-copy"><div class="brand-name">OpenGuitarTAB</div><div class="brand-subtitle">Guitar TAB Studio</div></div>
      </div>
      <nav class="primary-nav" aria-label="網站導覽">
        <button class="nav-button" id="catalogNavButton" type="button">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5V20.5h13V9.5"/><path d="M9.5 20.5v-6h5v6"/></svg></span>
          <span class="nav-label">公共曲庫</span>
        </button>
        <button class="nav-button" id="libraryNavButton" type="button">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></span>
          <span class="nav-label">個人曲譜櫃</span>
        </button>
      </nav>
      <div class="sidebar-head"><div class="sidebar-title">我的曲譜</div><button class="new-song-button" id="newSongButton" type="button" aria-label="新增曲譜">+</button></div>
      <div class="song-list" id="songList"></div>
      <div class="sidebar-session" id="sidebarSession"></div>
      <a href="./privacy.html" style="display:block;padding:12px 20px;color:#b8b8b8;font-size:13px;">隱私權政策</a>
    </aside>
    <div class="mobile-menu-backdrop" id="mobileMenuBackdrop" hidden></div>

    <section class="page-view catalog-view" id="catalogView" aria-label="公共曲庫">
      <div class="catalog-hero">
        <div class="catalog-hero-copy"><h1>找到想彈的歌，直接開始看譜。</h1><p class="catalog-lead">公共曲譜以唯讀方式提供預覽，登入後可以加入自己的曲譜櫃。</p></div>
        <label class="catalog-search"><span>⌕</span><input id="catalogSearchInput" type="search" placeholder="搜尋曲名或作者" autocomplete="off" /></label>
      </div>
      <span class="catalog-count" id="catalogCount"></span>
      <div class="song-card-grid" id="catalogGrid"></div>
    </section>

    <section class="page-view library-view" id="libraryView" hidden aria-label="個人曲譜櫃">
      <div class="library-hero">
        <div class="library-hero-copy"><h1>個人曲譜櫃</h1><p id="libraryStorageHint">登入後從Google Drive載入你的曲譜。</p></div>
        <div class="library-hero-controls">
          <label class="catalog-search library-search"><span>⌕</span><input id="librarySearchInput" type="search" placeholder="搜尋曲名或作者" autocomplete="off" /></label>
          <button class="primary-action" id="libraryNewSongButton" type="button">＋ 新增曲譜</button>
        </div>
      </div>
      <div class="song-card-grid" id="libraryGrid"></div>
    </section>

    <div class="content edit-view page-view editor-view" id="editorView" hidden>
      <header class="editor-header">
        <div class="topbar">
          <div class="header-left">
            <button class="back-button" id="editorBackButton" type="button" aria-label="返回">←</button>
            <div class="header-actions">
              <button class="save-button" id="saveSongButton" type="button">儲存</button>
              <button class="download-button" id="downloadSongButton" type="button">上傳</button>
              <button class="add-preview-button" id="addPreviewSongButton" type="button" hidden aria-label="加入曲譜櫃" data-tooltip="加入曲譜櫃">+</button>
            </div>
          </div>
          <div class="editor-title-wrap"><h1 id="editorTitle">吉他 TAB 譜製作器</h1><span class="preview-badge" id="previewBadge" hidden>預覽</span></div>
          <div class="play-panel" aria-label="播放控制">
            <button class="mode-toggle-button" id="rhythmToggleButton" type="button" aria-pressed="false" aria-label="看譜模式已關閉，開啟看譜模式">
              <span class="mode-toggle-label">看譜模式</span>
              <span class="mode-switch" aria-hidden="true"><span class="mode-switch-thumb"></span></span>
            </button>
            <div class="capo-box"><label for="capoInput">變調夾</label><input id="capoInput" type="number" min="0" max="12" step="1" value="0" inputmode="numeric" aria-label="變調夾品數" /><span class="progress-label">品</span></div>
            <div class="tempo-box"><label for="tempoInput">BPM</label><input id="tempoInput" type="number" min="30" max="300" step="1" value="120" inputmode="numeric" aria-label="播放速度 BPM" /></div>
            <div class="progress-box"><input id="playProgress" type="range" min="0" value="0" aria-label="播放進度" /><span class="progress-label" id="progressLabel">第 1 列 / 第 1 格</span></div>
            <button class="play-button" id="playButton" type="button" aria-label="播放 TAB 譜">播放</button>
          </div>
          <template id="meterBadge"></template>
        </div>
      </header>
      <main><section class="sheet" aria-label="吉他 TAB 編輯區"><div id="tabArea"></div><div class="actions"><button class="row-button remove-row" id="removeRow" type="button" aria-label="刪除最下面一列">−</button><button class="row-button add-row" id="addRow" type="button" aria-label="新增一列">+</button></div></section></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop auth-modal-backdrop" id="loginModal" aria-hidden="true">
    <div class="login-dialog" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
      <h2 id="loginModalTitle">登入OpenGuitarTAB</h2>
      <p class="login-description">登入後才能使用個人曲譜櫃。</p>
      <form id="loginForm" class="login-form">
        <label>帳號<input id="loginUsername" type="text" autocomplete="username" required /></label>
        <label>密碼<input id="loginPassword" type="password" autocomplete="current-password" required /></label>
        <p class="login-error" id="loginError" role="alert"></p>
        <button class="login-submit-button" type="submit">登入</button>
      </form>
      <div class="google-login-section" id="googleLoginSection" hidden>
        <div class="login-separator"><span>或</span></div>
        <button class="google-login-button" id="googleLoginButton" type="button"><span aria-hidden="true">G</span> 使用Google登入</button>
      </div>
      <button class="login-cancel-button" id="loginCancel" type="button">取消</button>
    </div>
  </div>

  <div class="modal-backdrop" id="renameModal" aria-hidden="true"><div class="rename-dialog" role="dialog" aria-modal="true" aria-labelledby="renameModalTitle"><h2 id="renameModalTitle">重新命名曲譜</h2><input class="rename-input" id="renameInput" type="text" maxlength="60" autocomplete="off" /><div class="rename-actions"><button class="modal-button cancel" id="renameCancel" type="button">取消</button><button class="modal-button confirm" id="renameConfirm" type="button">確定</button></div></div></div>

  <div class="modal-backdrop" id="publishModal" aria-hidden="true">
    <div class="rename-dialog publish-dialog" role="dialog" aria-modal="true" aria-labelledby="publishModalTitle">
      <h2 id="publishModalTitle">上傳到公共曲譜</h2>
      <p class="publish-description">請確認這首歌的作者（歌手）。上傳後會顯示你的帳號名稱。</p>
      <label class="publish-field" for="publishArtistInput">作者（歌手）</label>
      <input class="rename-input" id="publishArtistInput" type="text" maxlength="80" autocomplete="off" required />
      <p class="publish-uploader">上傳者：<strong id="publishUploader"></strong></p>
      <p class="publish-error" id="publishError" role="alert"></p>
      <div class="rename-actions"><button class="modal-button cancel" id="publishCancel" type="button">取消</button><button class="modal-button confirm" id="publishConfirm" type="button">上傳</button></div>
    </div>
  </div>

  <div class="modal-backdrop" id="newSongModal" aria-hidden="true">
    <div class="rename-dialog new-song-dialog" role="dialog" aria-modal="true" aria-labelledby="newSongModalTitle">
      <h2 id="newSongModalTitle">新增曲譜</h2>
      <div class="new-song-choice-grid">
        <button class="new-song-choice" id="blankSongChoice" type="button"><strong>空白曲譜</strong><span>建立新的TAB</span></button>
        <button class="new-song-choice" id="uploadJsonButton" type="button"><strong>上傳</strong><span>匯入JSON曲譜</span></button>
      </div>
      <div class="blank-song-options" id="blankSongOptions" hidden>
        <p class="delete-message">選擇每小節拍數</p>
        <div class="meter-choice" role="group" aria-label="每小節拍數"><button class="meter-choice-button" id="newSongThreeBeats" type="button">3 拍</button><button class="meter-choice-button" id="newSongFourBeats" type="button">4 拍</button></div>
      </div>
      <input id="uploadJsonInput" type="file" accept="application/json,.json" hidden />
      <div class="rename-actions"><button class="modal-button cancel" id="newSongCancel" type="button">取消</button></div>
    </div>
  </div>

  <div class="modal-backdrop" id="deleteModal" aria-hidden="true"><div class="rename-dialog" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle"><h2 id="deleteModalTitle">刪除曲譜</h2><p class="delete-message">確定要刪除 <span class="delete-song-name" id="deleteSongName"></span> 嗎？</p><p class="delete-message">刪除後無法從曲譜庫復原。</p><div class="rename-actions"><button class="modal-button cancel" id="deleteCancel" type="button">取消</button><button class="modal-button danger" id="deleteConfirm" type="button">刪除</button></div></div></div>
  <script type="module" src="./src/bootstrap.js"></script>
</body>
</html>
